# Entorno LOCAL: MLflow + entrenamiento + API de scoring.
# El servicio `trainer` entrena el modelo y termina; `api` arranca cuando el
# entrenamiento ha finalizado con exito (volumen compartido /models).
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    # Sin healthcheck el trainer arrancaba antes de que MLflow aceptase conexiones
    # y el run de tracking se perdia (o el entrenamiento fallaba).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    restart: unless-stopped

  trainer:
    build: .
    command: python -m churn.training.train --rows 20000 --model-dir /models
    environment:
      CHURN_MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - models:/models
    depends_on:
      mlflow:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8010:8000"
    environment:
      CHURN_ENVIRONMENT: local
      CHURN_MODEL_DIR: /models
      CHURN_ADMIN_TOKEN: token-local
    volumes:
      - models:/models
    depends_on:
      trainer:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mlflow-data:
  models:
