[project]
name = "mlops-churn-platform"
version = "1.2.0"
description = "Plataforma MLOps end-to-end para prediccion de churn (MLflow + FastAPI + drift)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["churn"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 1
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.12"  # los stubs de numpy usan sintaxis 3.12; es el runtime de Docker y CI
files = ["src/churn"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.mutmut]
# Mutation testing sobre los modulos puros (sin entrenar modelos): `make mutation`
paths_to_mutate = ["src/churn/monitoring/", "src/churn/data/"]
tests_dir = ["tests/"]
