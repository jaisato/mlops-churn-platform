[project]
name = "mlops-churn-platform"
version = "1.1.0"
description = "Plataforma MLOps end-to-end para prediccion de churn (MLflow + FastAPI + drift)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["churn"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 1
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
