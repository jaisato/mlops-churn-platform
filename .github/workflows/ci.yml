name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint, tipos y scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias (lockfile)
        run: pip install -r requirements-dev.lock
      - name: ruff (lint + formato)
        run: |
          ruff check .
          ruff format --check .
      - name: mypy
        run: mypy src/churn
      - name: Scripts de despliegue (bash -n + shellcheck)
        run: |
          bash -n deploy/scripts/*.sh
          docker run --rm -v "$PWD:/repo" -w /repo koalaman/shellcheck:stable -S warning deploy/scripts/*.sh
      - name: Workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest
      - name: Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint:latest < Dockerfile

  test:
    name: Tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar dependencias (lockfile)
        run: pip install -r requirements-dev.lock
      - name: pytest + cobertura (minimo 90%)
        run: pytest -v --cov=churn --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - name: Subir informe de cobertura
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  audit:
    name: Auditoria de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pip-audit sobre el lockfile de produccion
        # Informativo: una CVE sin parche aguas arriba no debe bloquear el resto del CI,
        # pero queda visible en el job.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --progress-spinner off

  docker-build:
    name: Compose y build de la imagen
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4

      - name: Validar ficheros compose (local y produccion)
        env:
          GITHUB_OWNER: ci
          CHURN_ADMIN_TOKEN: ci-token-de-validacion-0123456789
          VPN_BIND_IP: 127.0.0.1
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml --profile train config -q

      - name: Build de validacion (sin push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: mlops-churn-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
