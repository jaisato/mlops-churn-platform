name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias (lockfile)
        run: pip install -r requirements-dev.lock

      - name: Lint (ruff)
        run: ruff check .

      - name: Sintaxis de scripts de despliegue
        run: bash -n deploy/scripts/deploy.sh deploy/scripts/setup-vps.sh

      - name: Tests (pytest + cobertura, minimo 90%)
        run: pytest -v --cov=churn --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Subir informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Validar ficheros compose (local y produccion)
        env:
          GITHUB_OWNER: ci
          CHURN_ADMIN_TOKEN: ci-token-de-validacion-0123456789
          VPN_BIND_IP: 127.0.0.1
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml --profile train config -q

      - name: Build de validacion (sin push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mlops-churn-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
