# CI: la parte Python (ruff, mypy, pytest con cobertura, pip-audit, build de la
# imagen) la ejecuta el workflow reutilizable de jaisato/.github; aquí solo
# quedan las comprobaciones propias de este repositorio (scripts de despliegue,
# Dockerfile y ficheros compose).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python
    uses: jaisato/.github/.github/workflows/python-ci.yml@main
    with:
      python-versions: '["3.11", "3.12", "3.13"]'
      # mypy necesita 3.12: los stubs de numpy usan sintaxis 3.12 (ver pyproject).
      tools-python-version: "3.12"
      install-command: pip install -r requirements-dev.lock
      ruff-paths: .
      ruff-format: true
      run-mypy: true
      mypy-paths: src/churn
      coverage-min: 90
      coverage-source: churn
      extra-test-args: -v
      run-pip-audit: true
      # Informativo (pip-audit-strict=false): una CVE sin parche aguas arriba no
      # bloquea el resto del CI, pero queda visible en el job.
      pip-audit-args: -r requirements.lock
      docker-build: true

  repo-checks:
    name: Scripts de despliegue, Dockerfile y compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scripts de despliegue (bash -n + shellcheck)
        run: |
          bash -n deploy/scripts/*.sh
          shellcheck -S warning deploy/scripts/*.sh

      - name: Workflows (actionlint)
        run: pipx run --spec 'actionlint-py==1.7.12.25' actionlint -no-color .github/workflows/*.yml

      - name: Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint:latest < Dockerfile

      - name: Validar ficheros compose (local y produccion)
        env:
          GITHUB_OWNER: ci
          CHURN_ADMIN_TOKEN: ci-token-de-validacion-0123456789
          VPN_BIND_IP: 127.0.0.1
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml --profile train config -q
