name: Release y despliegue (VPS netcup via VPN)

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de imagen a desplegar (p. ej. v1.0.0 o 1.0.0; por defecto latest)"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mlops-churn-platform

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Login en GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos de imagen (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` se publica en cada release (tag v*) y en builds manuales desde la rama
          # por defecto. Con `{{is_default_branch}}` a secas nunca se publicaba en releases
          # (un tag no es una rama) y `TAG=latest` no encontraba imagen que descargar.
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref_name == github.event.repository.default_branch }}

      - name: Build y push a GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    environment: production
    concurrency: deploy-production
    steps:
      # Secretos e inputs llegan a los scripts por `env`, nunca interpolados con `${{ }}`
      # dentro de `run:`: la interpolacion se hace antes de que el shell vea el texto, asi que
      # un valor con `;`, comillas o `$(...)` se ejecutaria en el runner (y via ssh en el VPS).
      - name: Levantar tunel WireGuard hacia la red privada de netcup
        env:
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y wireguard-tools
          umask 077
          printf '%s\n' "$WG_CONFIG" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo wg-quick up wg0
          ping -c 2 "$DEPLOY_HOST" || true

      - name: Preparar clave SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          if [ -n "$DEPLOY_HOST_KEY" ]; then
            # Huella del VPS fijada como secreto (salida de `ssh-keyscan -t ed25519 <host>`):
            # un tercero en la ruta no puede suplantar el servidor.
            echo "$DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_HOST_KEY no definido; se acepta la huella del host en el primer contacto"
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi

      - name: Desplegar en el VPS (docker compose pull + up + healthcheck)
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          BUILT_VERSION: ${{ needs.build-push.outputs.version }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          VERSION="${INPUT_TAG:-$BUILT_VERSION}"
          VERSION="${VERSION#v}"   # las imagenes se etiquetan sin la "v" (semver)
          # Solo tags que puede producir build-push: latest, X.Y.Z[-pre] o sha-<hash>. El valor
          # viaja dentro del comando remoto de ssh, asi que cualquier otra cosa se rechaza.
          # `[[ =~ ]]` valida la cadena entera; grep iria linea a linea y un input con salto de
          # linea ("latest" + otra linea con un comando) pasaria el filtro.
          re='^(latest|[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?|sha-[0-9a-f]{7,40})$'
          if [[ ! "$VERSION" =~ $re ]]; then
            echo "::error::Tag de imagen no valido: se espera latest, X.Y.Z o sha-<hash>"
            exit 1
          fi
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/mlops-churn-platform && TAG='$VERSION' ./deploy/scripts/deploy.sh"

      - name: Smoke test post-despliegue
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" \
            "curl -fsS --max-time 10 http://localhost:8010/health" \
            && echo 'Despliegue verificado'

      - name: Cerrar tunel VPN
        if: always()
        run: sudo wg-quick down wg0 || true
